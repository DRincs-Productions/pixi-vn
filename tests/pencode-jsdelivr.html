<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pixi'VN jsDelivr CDN smoke test</title>
        <!-- PIXIVN_IMPORT_MAP -->
    </head>
    <body data-status="loading">
        <main id="result">Loading Pixi'VN from jsDelivr…</main>
        <script type="module">
            const params = new URLSearchParams(window.location.search);
            const source = params.get("source") || "public";
            const version = params.get("version") || "latest";
            const result = document.querySelector("#result");

            try {
                const moduleUrl =
                    source === "local"
                        ? "@drincs/pixi-vn"
                        : `https://cdn.jsdelivr.net/npm/@drincs/pixi-vn@${encodeURIComponent(version)}/+esm`;
                if (source !== "local" && source !== "public") {
                    throw new Error(`Unknown package source: ${source}`);
                }
                const pixiVN = await import(moduleUrl);

                if (typeof pixiVN.Game !== "object" || typeof pixiVN.Game.init !== "function") {
                    throw new Error("Game.init was not exported by the CDN module");
                }

                await pixiVN.Game.init();
                pixiVN.storage.set("pencode-cdn-smoke", "ok");
                if (pixiVN.storage.get("pencode-cdn-smoke") !== "ok") {
                    throw new Error("Storage smoke check failed after CDN initialization");
                }

                document.body.dataset.status = "passed";
                document.body.dataset.source = source;
                document.body.dataset.version = String(pixiVN.PIXIVN_VERSION);
                const sourceDescription = source === "local" ? "local dist via the local import map" : "jsDelivr";
                result.textContent = `Loaded Pixi'VN ${pixiVN.PIXIVN_VERSION} from ${sourceDescription}; Game.init() and storage passed.`;
            } catch (error) {
                document.body.dataset.status = "failed";
                result.textContent = error instanceof Error ? error.stack || error.message : String(error);
            }
        </script>
    </body>
</html>
