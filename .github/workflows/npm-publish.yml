# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      run_deploy_docs:
        description: "Run only deploy-docs"
        required: false
        default: "false"

run-name: ${{ github.workflow }} for ${{ github.ref_name }} by @${{ github.actor }}

jobs:
  test:
    name: Test supported Node.js versions
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: ["20.19.0", "22.18.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --workspaces=false
      - run: npm test || npm test
      - run: npm run test:cdn
        if: matrix.node-version != '20.19.0'

  publish-npm:
    name: Publish to NPM
    needs: [test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org/
      - run: |
          npm ci --workspaces=false
          npm run build
      - run: npm publish -f
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

  create-release:
    name: Create Release
    needs: publish-npm
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        body: |
          Release ${{ github.ref_name }}

  check-wiki-write-access:
    name: Check Wiki write access
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.run_deploy_docs == 'true'
    permissions:
      contents: write
    outputs:
      writable: ${{ steps.probe.outputs.writable }}
    steps:
      - name: Probe Wiki write access
        id: probe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-probe; then
            echo "writable=false" >> "$GITHUB_OUTPUT"
            echo "Wiki is unavailable to this workflow; documentation deployment will be skipped."
            exit 0
          fi
          cd wiki-probe
          branch="$(git branch --show-current)"
          if [ -z "$branch" ]; then
            echo "writable=false" >> "$GITHUB_OUTPUT"
            echo "Could not determine the Wiki branch; documentation deployment will be skipped."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit --allow-empty -m "Probe Wiki write access"
          if git push --dry-run origin "HEAD:$branch" >/dev/null 2>&1; then
            echo "writable=true" >> "$GITHUB_OUTPUT"
          else
            echo "writable=false" >> "$GITHUB_OUTPUT"
            echo "Workflow token cannot write to the Wiki; documentation deployment will be skipped."
          fi

  deploy-docs:
    name: Deploy Docs to Wiki
    needs: check-wiki-write-access
    runs-on: ubuntu-latest
    if: needs.check-wiki-write-access.outputs.writable == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Install deps
        run: npm ci --workspaces=false

      - name: Generate docs
        run: npm run docs

      - name: Check generated docs
        run: test -n "$(find doc -type f -print -quit)"

      - name: Clone Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Clean Wiki (safe)
        run: |
          find wiki -mindepth 1 -not -path "wiki/.git*" -delete

      - name: Copy docs
        run: |
          cp -r doc/* wiki/

      - name: Commit & Push
        run: |
          cd wiki
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update TypeDoc API docs"
          git push
