# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      run_deploy_docs:
        description: "Run only deploy-docs"
        required: false
        default: "false"

run-name: Deploy to ${{ inputs.deploy_target }} by @${{ github.actor }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        node-version: [22.22.2, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run test:cdn

  publish-npm:
    name: Publish to NPM
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org/
      - run: |
          npm ci
          npm run build
      - run: npm publish -f
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

  create-release:
    name: Create Release
    needs: publish-npm
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Extract dependency versions
      id: versions
      run: |
        PIXIJS_VERSION=$(node -p "require('./package.json').dependencies['pixi.js']")
        TONE_VERSION=$(node -p "require('./package.json').dependencies['tone']")
        PIXIDEVTOOLS_VERSION=$(node -p "require('./package.json').dependencies['@pixi/devtools']")
        MOTION_VERSION=$(node -p "require('./package.json').dependencies['motion']")
        echo "pixijs=$PIXIJS_VERSION" >> $GITHUB_OUTPUT
        echo "pixidevtools=$PIXIDEVTOOLS_VERSION" >> $GITHUB_OUTPUT
        echo "tone=$TONE_VERSION" >> $GITHUB_OUTPUT
        echo "motion=$MOTION_VERSION" >> $GITHUB_OUTPUT
    - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
      with:
        body: |
          Release ${{ github.ref }}
          
          ### Dependencies
          - **PixiJS**: ${{ steps.versions.outputs.pixijs }}
          - **Pixi Devtools**: ${{ steps.versions.outputs.pixidevtools }}
          - **Tone.js**: ${{ steps.versions.outputs.tone }}
          - **Motion**: ${{ steps.versions.outputs.motion }}

  deploy-docs:
    name: Deploy Docs to Wiki
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event.inputs.run_deploy_docs == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0

      - name: Install deps
        run: npm i

      - name: Generate docs
        run: npm run docs

      - name: Clone Wiki
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Clean Wiki (safe)
        run: |
          find wiki -mindepth 1 -not -path "wiki/.git*" -delete

      - name: Copy docs
        run: |
          cp -r doc/* wiki/

      - name: Commit & Push
        run: |
          cd wiki
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update TypeDoc API docs"
          git push
